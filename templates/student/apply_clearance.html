{% extends 'base.html' %}
{% block title %}Apply for Clearance | MAU Clearance{% endblock %}
{% block content %}
<div class="mb-4">
    <a class="btn btn-outline-secondary" href="{{ url_for('student_dashboard') }}">Back to Dashboard</a>
</div>
<div class="card shadow-sm border-0">
    <div class="card-body">
        <h3 class="mb-3">Apply for Clearance</h3>
        <form method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Purpose</label>
                <input type="text" class="form-control" name="purpose" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Academic Year</label>
                <input type="text" class="form-control" name="academic_year" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Upload Photo</label>
                <input type="file" class="form-control" name="photo" accept="image/*">
                <div class="form-text">Optional passport-style photo for the clearance request.</div>
            </div>
            <button class="btn btn-primary" type="submit">Submit Application</button>
        </form>
    </div>
</div>
{% endblock %}
