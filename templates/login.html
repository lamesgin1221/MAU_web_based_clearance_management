{% extends 'base.html' %}
{% block title %}Login | MAU Clearance{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <img src="{{ url_for('assets_file', filename='images/Mekdela_Amba_University_logo.jpg') }}" alt="MAU Logo" class="img-fluid" style="max-height: 120px; object-fit: contain;">
                </div>
                <h2 class="card-title mb-3">Sign In</h2>
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Email address</label>
                        <input type="email" class="form-control" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <div class="input-group password-toggle">
                            <input type="password" class="form-control" name="password" required>
                            <button class="btn btn-outline-secondary" type="button" aria-label="Show password">👁</button>
                        </div>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Login</button>
                </form>
                <p class="mt-3 mb-0 text-muted">New student? <a href="{{ url_for('register') }}">Create a student account</a></p>
                <p class="mt-2 mb-0 text-muted">Office staff? <a href="{{ url_for('register_office') }}">Register an office account</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
