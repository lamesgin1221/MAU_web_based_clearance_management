{% extends 'base.html' %}
{% block title %}Register Office Staff | MAU Clearance{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="card-title mb-3">Register Office Account</h2>
                <p class="text-muted mb-3">Use this form for department, library, dormitary, or registrar staff.</p>
                <form method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" name="full_name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone Number</label>
                            <input type="text" class="form-control" name="phone">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Office Role</label>
                            <select class="form-select" name="role" required>
                                <option value="">Select role</option>
                                <option value="department">Department</option>
                                <option value="library">Library</option>
                                <option value="dormitary">Dormitary</option>
                                <option value="registrar">Registrar</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Password</label>
                            <div class="input-group password-toggle">
                                <input type="password" class="form-control" name="password" required>
                                <button class="btn btn-outline-secondary" type="button" aria-label="Show password">👁</button>
                            </div>
                        </div>
                    </div>
                    <button class="btn btn-primary mt-4" type="submit">Register Office Account</button>
                </form>
                <p class="mt-3 mb-0 text-muted">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
                <p class="mt-2 mb-0 text-muted">Student? <a href="{{ url_for('register') }}">Register here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
